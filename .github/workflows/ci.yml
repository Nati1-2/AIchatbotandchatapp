name: Relay checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U relay" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.13.5', python-version: '3.12'}
      - run: uv sync --frozen --all-groups
        working-directory: backend
      - run: uv run alembic upgrade head && uv run alembic check
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://relay:relay@localhost:5432/relay_test
      - run: uv run pytest -q
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://relay:relay@localhost:5432/relay_test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.13.5', python-version: '3.12'}
      - run: uv sync --frozen --all-groups
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm test && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: browser-results, path: frontend/test-results}
