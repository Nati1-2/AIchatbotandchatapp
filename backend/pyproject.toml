[project]
name = "relay-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy[asyncio]>=2.0.38,<3",
    "asyncpg>=0.30,<1",
    "aiosqlite>=0.20,<1",
    "fakeredis>=2.26,<3",
    "alembic>=1.14,<2",
    "redis>=5.2,<7",
    "pydantic-settings>=2.7,<3",
    "argon2-cffi>=23.1,<26",
    "python-multipart>=0.0.20,<1",
    "boto3>=1.36,<2",
    "httpx>=0.28,<1",
    "websockets>=15,<18",
    "pillow>=11,<13"
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
