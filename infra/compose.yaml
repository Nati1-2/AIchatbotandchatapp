name: relay
x-api-env: &api-env
  ENVIRONMENT: development
  DATABASE_URL: postgresql+asyncpg://relay:relay@postgres:5432/relay
  REDIS_URL: redis://redis:6379/0
  FRONTEND_ORIGIN: http://localhost:3000
  SECURE_COOKIES: "false"
  S3_ENDPOINT: http://storage:9000
  S3_ACCESS_KEY: relay-local
  S3_SECRET_KEY: relay-local-secret
  S3_BUCKET: relay-private
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-gemini-2.5-flash}
  AI_BASE_URL: ${AI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20
  storage:
    # S3-compatible store (MinIO images are no longer published on Docker Hub).
    image: rustfs/rustfs:latest@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    environment:
      RUSTFS_ACCESS_KEY: relay-local
      RUSTFS_SECRET_KEY: relay-local-secret
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["s3-data:/data"]
  storage-init:
    build: ../backend
    environment: *api-env
    command: ["python", "-m", "app.storage_init"]
    depends_on: [storage]
  migrate:
    build: ../backend
    environment: *api-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
  seed:
    build: ../backend
    environment: *api-env
    command: ["python", "-m", "app.seed"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  api:
    build: ../backend
    environment: *api-env
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
  worker:
    build: ../backend
    environment: *api-env
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api, seed]
volumes:
  pg-data:
  s3-data:
