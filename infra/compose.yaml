name: relay
x-api-env: &api-env
  ENVIRONMENT: development
  DATABASE_URL: postgresql+asyncpg://relay:relay@postgres:5432/relay
  REDIS_URL: redis://redis:6379/0
  FRONTEND_ORIGIN: http://localhost:3000
  SECURE_COOKIES: "false"
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: relay-local
  S3_SECRET_KEY: relay-local-secret
  S3_BUCKET: relay-private
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-gpt-4.1-mini}
  AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: relay-local
      MINIO_ROOT_PASSWORD: relay-local-secret
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["s3-data:/data"]
  storage-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 relay-local relay-local-secret; do sleep 2; done;
        mc mb --ignore-existing local/relay-private && mc anonymous set none local/relay-private
  migrate:
    build: ../backend
    environment: *api-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
  seed:
    build: ../backend
    environment: *api-env
    command: ["python", "-m", "app.seed"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  api:
    build: ../backend
    environment: *api-env
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
  worker:
    build: ../backend
    environment: *api-env
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api, seed]
volumes:
  pg-data:
  s3-data:
