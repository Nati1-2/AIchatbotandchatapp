events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Render terminates TLS before forwarding traffic to this container. Keep
    # the public scheme so same-origin auth/CSRF checks see https, not the
    # internal http connection between Render and Nginx.
    map $http_x_forwarded_proto $public_scheme {
        default $http_x_forwarded_proto;
        '' $scheme;
    }

    server {
        listen PORT_PLACEHOLDER;

        # WebSocket endpoint
        location /ws {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $public_scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Full-duplex Gemini Live audio relay.
        location /ai/live/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $public_scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # FastAPI backend API routes
        location ~ ^/(auth|conversations|messages|profile|users|ai|attachments|health|ready|docs|openapi.json)(/|$) {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $public_scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_buffering off;
        }

        # Next.js Frontend
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $public_scheme;
        }
    }
}

