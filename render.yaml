services:
  # All-in-One Service: Runs Next.js frontend + FastAPI backend on the same domain
  - type: web
    name: relay
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AI_API_KEY
        sync: false
